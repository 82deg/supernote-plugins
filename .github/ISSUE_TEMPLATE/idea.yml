name: Idea or request
description: Suggest an improvement or a new plugin
labels: [idea]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Which plugin?
      options:
        - Image Placer
        - A new plugin
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: What would you like to do, and why?
    validations:
      required: true
